[server]
# Local development backend. Replace with the Windows server LAN IP on a Pi.
SERVER_URL = http://127.0.0.1:8000
PI_NODE_TOKEN = CHANGE_ME
PI_SERVER_HOST = 0.0.0.0
PI_SERVER_PORT = 5000

[camera]
RESOLUTION_WIDTH = 1920
RESOLUTION_HEIGHT = 1080
IMAGE_FORMAT = jpeg
AUTOFOCUS_WAIT = 1.5

[load_cell]
HX711_DT_PIN = 5
HX711_SCK_PIN = 6
CALIBRATION_FACTOR = 1.0
READINGS_TO_AVERAGE = 10
WEIGHT_MIN_G = 340
WEIGHT_MAX_G = 360

[gpio]
TRIGGER_BUTTON_PIN = 17
STATUS_LED_PIN = 27
