<VirtualHost *:80>
    ServerName cgi.local
    DocumentRoot /var/www/html/CGI-V2/frontend

    # PHP frontend
    <Directory /var/www/html/CGI-V2/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy all /api/* requests to FastAPI backend
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Proxy static uploads served by FastAPI
    ProxyPass        /static/ http://127.0.0.1:8000/static/
    ProxyPassReverse /static/ http://127.0.0.1:8000/static/

    ErrorLog  ${APACHE_LOG_DIR}/cgi_error.log
    CustomLog ${APACHE_LOG_DIR}/cgi_access.log combined
</VirtualHost>
